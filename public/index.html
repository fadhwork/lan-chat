<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat LAN</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --text:#1d1f23; --muted:#7a8088; --accent:#2f6fed; --mine:#dce8ff; --border:#e2e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --panel:#1f2227; --text:#e8eaed; --muted:#8b929b; --accent:#5b8cff; --mine:#27406e; --border:#2c3037; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--text); display: flex; }
  #side { width: 200px; background: var(--panel); border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
  #side h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  #side div { padding: 4px 0; font-size: .9em; }
  #side div::before { content: "● "; color: #3bb55e; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: var(--mine); }
  body.compact { font-size: 6px; }
  body.compact #side { display: none; }
  body.compact #main { position: fixed; z-index: 2147483000; right: 12px; bottom: 12px; width: min(340px, calc(100vw - 24px)); height: min(420px, calc(100vh - 24px)); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.28); overflow: hidden; }
  body.compact #messages { padding: 4px; gap: 2px; }
  body.compact .msg { max-width: 92%; border-radius: 5px; padding: 2px 4px; }
  body.compact .meta { font-size: 6px; margin-bottom: 1px; }
  body.compact #typing { height: 9px; padding: 0 5px; font-size: 6px; }
  body.compact #bar { gap: 3px; padding: 3px; }
  body.compact #text { padding: 3px 5px; font-size: 6px; }
  body.compact #bar button { padding: 2px 5px; font-size: 6px; border-radius: 4px; }
  body.compact #bar button.ghost { font-size: 10px; }
  body.compact #note { padding: 2px; font-size: 6px; }
  body.compact #imageFloat { font-size: 12px; }
  body.compact #typing { line-height: 9px; }
  body.compact #messages .imageFloatButton { padding: 2px 4px; font-size: 6px; }
  body.compact #messages .imageFloatNumber { min-width: 14px; height: 14px; font-size: 6px; }
  body.compact #bar #compactToggle { font-size: 6px; padding: 3px 5px; }
  body.compact #bar #compactPip { font-size: 6px; padding: 3px 5px; }
  body.pip-mode #side, body.pip-mode #imageFloat, body.pip-mode #settings, body.pip-mode #drop { display: none !important; }
  body.pip-mode #main { position: static !important; z-index: auto !important; width: 100% !important; height: 100% !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
  body.pip-mode #messages { min-height: 0; }
  body.compact #bar #compactClear { display: inline-block !important; font-size: 6px; padding: 3px 5px; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg img { max-width: min(100%, 80px); max-height: 80px; width: auto; height: auto; object-fit: contain; border-radius: 6px; display: block; margin-top: 4px; cursor: zoom-in; }
  #imageFloat { display: none; position: fixed; z-index: 30; top: 72px; left: 50%; transform: translateX(-50%); width: min(360px, 85vw); max-height: 75vh; overflow: hidden; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  #imageFloat.open { display: block; }
  #imageFloatHeader { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px; background: var(--accent); color: #fff; cursor: grab; touch-action: none; user-select: none; }
  #imageFloatHeader:active { cursor: grabbing; }
  #imageFloatTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #imageFloatClose { border: 0; border-radius: 6px; padding: 2px 9px; background: rgba(255,255,255,.2); color: #fff; cursor: pointer; }
  #imageFloatBody { padding: 8px; overflow: auto; max-height: calc(75vh - 42px); text-align: center; }
  #imageFloatBody img { display: block; max-width: 100%; max-height: calc(75vh - 60px); width: auto; height: auto; margin: 0 auto; object-fit: contain; }
  .msg a { color: var(--accent); }
  #note { display: none; text-align: center; font-size: 12px; color: var(--muted); padding: 6px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #typing { height: 20px; padding: 0 16px; font-size: 12px; color: var(--muted); }
  #bar { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-top: 1px solid var(--border); }
  #text { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 0 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); font-size: 18px; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 14px; }
  #bar #compactClear { display: none; }
  #bar #compactPip { display: inline-block; }
  body.pip-mode #bar #compactToggle { display: none; }
  body.pip-mode #bar #compactPip { display: inline-block !important; font-size: 6px; padding: 3px 5px; }
  body.pip-mode #bar #compactPip { display: inline-block !important; font-size: 6px; padding: 3px 5px; }
  #drop { display: none; position: fixed; inset: 0; background: rgba(47,111,237,.15); border: 3px dashed var(--accent); align-items: center; justify-content: center; font-size: 22px; z-index: 9; }
  #settings { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; z-index: 10; }
  #settings .card { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 18px; width: min(360px, 92vw); display: flex; flex-direction: column; gap: 12px; }
  #settings .card { max-height: 90vh; overflow-y: auto; }
  #settings h3 { margin: 0; }
  #adminBox h4 { margin: 4px 0 8px; }
  #adminBox .arow { display: flex; gap: 6px; margin-bottom: 6px; }
  #settings .arow input[type=text] { flex: 1; width: auto; min-width: 0; }
  #settings label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
  #settings input[type=text] { width: 190px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  #settings input[type=color] { width: 48px; height: 28px; padding: 0; border: 1px solid var(--border); background: none; }
  #settings .row { display: flex; gap: 8px; justify-content: flex-end; }
  #settings button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 14px; }
  #settings button { padding: 8px 14px; }
  @media (max-width: 600px) { #side { display: none; } }
</style>
</head>
<body>
<div id="side"><h3>Sedang online</h3><div id="users"></div></div>
<div id="main">
  <div id="note"></div>
  <div id="messages"></div>
  <div id="typing"></div>
  <div id="bar">
    <button class="ghost" id="attach" title="Kirim file">📎</button>
    <button class="ghost" id="sound" title="Suara aktif/nonaktif">🔊</button>
    <button class="ghost" id="gear" title="Pengaturan">⚙️</button>
    <button id="compactToggle" type="button" aria-pressed="false" title="Tampilan pojok">Pojok</button>
    <button id="compactPip" type="button" class="secondary" title="Buka chat di jendela Picture-in-Picture">PiP</button>
    <button id="compactClear" type="button" class="secondary" style="display:none" title="Hapus semua chat">Hapus chat</button>
    <input type="file" id="fileInput" hidden>
    <input id="text" placeholder="Tulis pesan..." autocomplete="off">
    <button id="send">Kirim</button>
  </div>
</div>
<div id="drop">Lepaskan file untuk mengirim</div>
<div id="imageFloat" role="dialog" aria-label="Pratinjau gambar">
  <div id="imageFloatHeader"><span id="imageFloatTitle">Pratinjau gambar</span><button id="imageFloatClose" type="button" aria-label="Tutup">×</button></div>
  <div id="imageFloatBody"><img id="imageFloatImage" alt="Pratinjau gambar"></div>
</div>
<div id="settings">
  <div class="card">
    <h3>Pengaturan</h3>
    <label>Judul tab <input type="text" id="setTitle" maxlength="40"></label>
    <label>Nama pengguna <input type="text" id="setName" maxlength="30"></label>
    <label>Warna latar <input type="color" id="setBg"></label>
    <label>Warna teks <input type="color" id="setFg"></label>
    <label>Ukuran huruf <span><input type="range" id="setSize" min="12" max="24" step="1"> <span id="sizeVal"></span></span></label>
    <div id="adminBox"></div>
    <div class="row">
      <button class="secondary" id="setReset">Atur ulang</button>
      <button id="setClose">Selesai</button>
    </div>
  </div>
</div>

<script>
let name = localStorage.getItem('chatName');
while (!name || !name.trim()) name = prompt('Masukkan nama Anda:') || '';
name = name.trim().slice(0, 30);
localStorage.setItem('chatName', name);

const $ = (id) => document.getElementById(id);
const messages = $('messages');
const main = $('main');
let ws;
let isAdmin = false, canLogin = false, onlineUsers = [];
const unseenIds = new Set(); // messages from others that are on screen but not yet reported as read
let imagePreviewCount = 0;
let compactMode = localStorage.getItem('chatCompactMode') === 'on';
let pipWindow = null;

function fmtSize(b) { return b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(b/1024))+' KB'; }
function fmtTime(t) { return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

function addMessage(m) {
  const div = document.createElement('div');
  div.className = 'msg' + (m.user === name ? ' mine' : '');
  if (m.id) {
    div.dataset.id = m.id;
    if (m.user !== name) unseenIds.add(m.id);
  }
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = m.user + ' · ' + fmtTime(m.time);
  div.appendChild(meta);

  if (m.type === 'chat') {
    div.appendChild(document.createTextNode(m.text)); // textContent-safe: no HTML injection
  } else if (m.type === 'file') {
    const a = document.createElement('a');
    a.href = m.file.url; a.target = '_blank'; a.download = m.file.name;
    a.textContent = '📄 ' + m.file.name + ' (' + fmtSize(m.file.size) + ')';
    div.appendChild(a);
    if (m.file.isImage) {
      const img = document.createElement('img');
      img.src = m.file.url;
      img.alt = m.file.name || 'Gambar';
      img.title = 'Klik untuk membuka pratinjau mengambang';
      img.addEventListener('click', () => openImageFloat(m.file.url, m.file.name));
      div.appendChild(img);
    }
  }
  const atBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
  messages.appendChild(div);
  if (atBottom || m.user === name) messages.scrollTop = messages.scrollHeight;
}

let typingTimer;
function connect() {
  ws = new WebSocket('ws://' + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', name }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'history') { messages.innerHTML = ''; unseenIds.clear(); m.messages.forEach(addMessage); messages.scrollTop = messages.scrollHeight; flushSeen(); }
    else if (m.type === 'chat' || m.type === 'file') {
      addMessage(m);
      if (m.user !== name) notify();
      flushSeen();
    }
    else if (m.type === 'role') { isAdmin = m.admin; canLogin = m.canLogin; showNote(m); refreshAdmin(); syncCompactAdminButton(); }
    else if (m.type === 'remove') removeMessages(m.ids);
    else if (m.type === 'cleared') { messages.innerHTML = ''; unseenIds.clear(); }
    else if (m.type === 'renamed') {
      name = m.name; localStorage.setItem('chatName', name);
      if ($('setName')) $('setName').value = name;
    }
    else if (m.type === 'error') { alert(m.message === 'Wrong admin password' ? 'Kata sandi admin salah' : m.message === 'That name is already used by someone' ? 'Nama tersebut sudah digunakan orang lain' : m.message); }
    else if (m.type === 'users') {
      onlineUsers = m.users; refreshAdmin();
      $('users').innerHTML = '';
      m.users.forEach((u) => { const d = document.createElement('div'); d.textContent = u; $('users').appendChild(d); });
    }
    else if (m.type === 'typing') {
      $('typing').textContent = m.user + ' sedang mengetik...';
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => $('typing').textContent = '', 1500);
    }
  };
  ws.onclose = () => setTimeout(connect, 2000); // auto-reconnect
}
connect();

function applyCompactMode() {
  document.body.classList.toggle('compact', compactMode);
  const button = $('compactToggle');
  button.setAttribute('aria-pressed', String(compactMode));
  button.textContent = compactMode ? 'Normal' : 'Pojok';
  button.title = compactMode ? 'Kembali ke tampilan normal' : 'Tampilan pojok di browser';
  syncCompactAdminButton();
}
function syncCompactAdminButton() {
  $('compactClear').style.display = compactMode && isAdmin ? 'inline-block' : 'none';
}
$('compactClear').addEventListener('click', () => {
  if (isAdmin && confirm('Hapus SEMUA pesan dan file yang diunggah untuk semua orang?') && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'clearAll' }));
  }
});
$('compactPip').addEventListener('click', openCompactPiP);
$('compactToggle').addEventListener('click', () => {
  if (pipWindow) { if (!pipWindow.closed) pipWindow.close(); return; }
  compactMode = !compactMode;
  localStorage.setItem('chatCompactMode', compactMode ? 'on' : 'off');
  applyCompactMode();
});
async function openCompactPiP() {
  if (pipWindow && !pipWindow.closed) { pipWindow.focus(); return; }
  if (!('documentPictureInPicture' in window)) {
    alert('Picture-in-Picture tidak didukung browser ini. Gunakan Chrome atau Edge versi terbaru.');
    return;
  }
  try {
    const pip = await window.documentPictureInPicture.requestWindow({ width: 360, height: 460 });
    pipWindow = pip;
    pip.document.documentElement.lang = 'id';
    const base = document.createElement('base'); base.href = location.href; pip.document.head.appendChild(base);
    document.querySelectorAll('style, link[rel="stylesheet"]').forEach((node) => pip.document.head.appendChild(node.cloneNode(true)));
    const pipStyle = document.createElement('style');
    pipStyle.textContent = 'html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:6px system-ui,sans-serif}body{display:block}#side,#imageFloat,#settings,#drop{display:none!important}#main{position:static!important;z-index:auto!important;width:100%!important;height:100%!important;border:0!important;border-radius:0!important;box-shadow:none!important}#messages{min-height:0}';
    pip.document.head.appendChild(pipStyle);
    const placeholder = document.createComment('Pojok PiP return point');
    const home = main.parentNode; home.insertBefore(placeholder, main);
    pip.document.body.appendChild(main);
    document.body.classList.add('pip-mode');
    pip.addEventListener('pagehide', () => {
      if (placeholder.parentNode) placeholder.parentNode.replaceChild(main, placeholder);
      document.body.classList.remove('pip-mode'); pipWindow = null;
    }, { once: true });
    pip.document.getElementById('compactPip').textContent = 'Tutup';
    pip.document.getElementById('compactPip').title = 'Tutup jendela Picture-in-Picture';
    pip.document.getElementById('compactPip').addEventListener('click', () => pip.close());
  } catch (error) {
    pipWindow = null;
    alert('Gagal membuka Picture-in-Picture: ' + (error?.message || error));
  }
}
applyCompactMode();

// Click a thumbnail to open a Clippy-style floating preview; drag its header to move it.
function openImageFloat(url, title) {
  const panel = $('imageFloat');
  $('imageFloatImage').src = url;
  $('imageFloatTitle').textContent = title || 'Pratinjau gambar';
  panel.classList.add('open');
}
function closeImageFloat() {
  $('imageFloat').classList.remove('open');
  $('imageFloatImage').removeAttribute('src');
}
$('imageFloatClose').onclick = closeImageFloat;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeImageFloat(); });
(() => {
  const panel = $('imageFloat');
  const header = $('imageFloatHeader');
  let drag = null;
  header.addEventListener('pointerdown', (e) => {
    if (e.target === $('imageFloatClose')) return;
    const rect = panel.getBoundingClientRect();
    drag = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    panel.style.left = rect.left + 'px';
    panel.style.top = rect.top + 'px';
    panel.style.transform = 'none';
    header.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  header.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const left = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, e.clientX - drag.x));
    const top = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, e.clientY - drag.y));
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
  });
  const stop = () => { drag = null; };
  header.addEventListener('pointerup', stop);
  header.addEventListener('pointercancel', stop);
})();
// ---- Self-destruct: report what was read, remove what the server says has vanished ----
function showNote(m) {
  const n = $('note');
  if (m.selfDestruct) { n.textContent = 'Pesan akan terhapus setelah dibaca (' + m.seconds + ' detik per pesan)'; n.style.display = 'block'; }
  else n.style.display = 'none';
}
function flushSeen() {
  if (document.visibilityState !== 'visible' || !unseenIds.size || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'seen', ids: [...unseenIds] }));
  unseenIds.clear();
}
function removeMessages(ids) {
  for (const id of ids) {
    const el = messages.querySelector('[data-id="' + id + '"]');
    if (el) { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }
    unseenIds.delete(id);
  }
}

// ---- Settings (saved per browser) ----
const DEFAULTS = { title: 'Chat LAN', bg: '', fg: '', size: 16 };
let settings = { ...DEFAULTS };
try { settings = { ...DEFAULTS, ...JSON.parse(localStorage.getItem('chatSettings') || '{}') }; } catch {}
function saveSettings() { try { localStorage.setItem('chatSettings', JSON.stringify(settings)); } catch {} }

function applySettings() {
  const r = document.documentElement.style;
  settings.bg ? r.setProperty('--bg', settings.bg) : r.removeProperty('--bg');
  settings.fg ? r.setProperty('--text', settings.fg) : r.removeProperty('--text');
  document.body.style.fontSize = settings.size + 'px';
  updateBadge();
}

// ---- Sound + unread count ----
let unread = 0;
let soundOn = localStorage.getItem('chatSound') !== 'off';
let audioCtx;
const favicon = document.createElement('link');
favicon.rel = 'icon';
document.head.appendChild(favicon);

function drawFavicon(n) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#2f6fed';
  x.beginPath(); x.arc(32, 32, 30, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#fff';
  x.beginPath(); x.arc(32, 30, 14, 0, Math.PI * 2); x.fill();
  if (n > 0) {
    x.fillStyle = '#e5334b';
    x.beginPath(); x.arc(46, 18, 17, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#fff'; x.font = 'bold 22px sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(n > 9 ? '9+' : String(n), 46, 19);
  }
  favicon.href = c.toDataURL('image/png');
}
function updateBadge() {
  const t = settings.title || DEFAULTS.title;
  document.title = unread ? '(' + unread + ') ' + t : t;
  drawFavicon(unread);
}
function beep() {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1175, t + 0.12);
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.3);
  } catch {}
}
function notify() {
  if (!document.hidden && document.hasFocus()) return; // you are looking at the chat
  unread++; updateBadge(); beep();
}
function clearUnread() { if (unread) { unread = 0; updateBadge(); } }
window.addEventListener('focus', clearUnread);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearUnread(); flushSeen(); } });

$('sound').onclick = () => {
  soundOn = !soundOn;
  localStorage.setItem('chatSound', soundOn ? 'on' : 'off');
  $('sound').textContent = soundOn ? '🔊' : '🔇';
  beep();
};
$('sound').textContent = soundOn ? '🔊' : '🔇';
// browsers only allow sound after a click: unlock audio on first interaction
document.addEventListener('click', () => {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
}, { once: true });

// ---- Settings panel ----
function toHex(color) { // computed "rgb(r, g, b)" -> "#rrggbb" for the color inputs
  const m = color.match(/\d+/g) || [0, 0, 0];
  return '#' + m.slice(0, 3).map((n) => (+n).toString(16).padStart(2, '0')).join('');
}
function renderAdmin() {
  const box = $('adminBox');
  box.innerHTML = '';
  if (isAdmin) {
    const h = document.createElement('h4');
    h.textContent = 'Admin: ubah nama pengguna';
    box.appendChild(h);
    onlineUsers.forEach((u) => {
      const row = document.createElement('div');
      row.className = 'arow';
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = u; inp.maxLength = 30;
      const btn = document.createElement('button');
      btn.textContent = 'Ganti nama';
      btn.onclick = () => {
        const n = inp.value.trim();
        if (n && n !== u && ws.readyState === 1) ws.send(JSON.stringify({ type: 'rename', target: u, newName: n }));
      };
      row.append(inp, btn);
      box.appendChild(row);
    });
    const clr = document.createElement('button');
    clr.className = 'secondary';
    clr.textContent = 'Hapus semua chat';
    clr.onclick = () => {
      if (confirm('Hapus SEMUA pesan dan file yang diunggah untuk semua orang?') && ws.readyState === 1) ws.send(JSON.stringify({ type: 'clearAll' }));
    };
    box.appendChild(clr);
  } else if (canLogin) {
    const btn = document.createElement('button');
    btn.className = 'secondary';
    btn.textContent = 'Masuk sebagai admin';
    btn.onclick = () => {
      const pw = prompt('Kata sandi admin:');
      if (pw && ws.readyState === 1) ws.send(JSON.stringify({ type: 'adminLogin', password: pw }));
    };
    box.appendChild(btn);
  }
}
function refreshAdmin() { if ($('settings').style.display === 'flex') renderAdmin(); }
function openSettings() {
  const cs = getComputedStyle(document.documentElement);
  $('setTitle').value = settings.title;
  $('setName').value = name;
  $('setBg').value = settings.bg || toHex(getComputedStyle(document.body).backgroundColor);
  $('setFg').value = settings.fg || toHex(getComputedStyle(document.body).color);
  $('setSize').value = settings.size;
  $('sizeVal').textContent = settings.size + 'px';
  renderAdmin();
  $('settings').style.display = 'flex';
}
$('gear').onclick = openSettings;
$('setClose').onclick = () => { $('settings').style.display = 'none'; };
$('settings').addEventListener('click', (e) => { if (e.target === $('settings')) e.stopPropagation(); });
$('setTitle').oninput = (e) => { settings.title = e.target.value; saveSettings(); applySettings(); };
$('setBg').oninput = (e) => { settings.bg = e.target.value; saveSettings(); applySettings(); };
$('setFg').oninput = (e) => { settings.fg = e.target.value; saveSettings(); applySettings(); };
$('setSize').oninput = (e) => { settings.size = +e.target.value; $('sizeVal').textContent = settings.size + 'px'; saveSettings(); applySettings(); };
$('setName').onchange = (e) => {
  const n = e.target.value.trim().slice(0, 30);
  if (!n || n === name) { e.target.value = name; return; }
  name = n;
  localStorage.setItem('chatName', name);
  if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'join', name })); // updates online list, reloads history
};
$('setReset').onclick = () => {
  settings = { ...DEFAULTS };
  saveSettings(); applySettings(); openSettings();
};

applySettings();

function sendText() {
  const t = $('text').value;
  if (!t.trim() || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'chat', text: t }));
  $('text').value = '';
}
$('send').onclick = sendText;
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });
let lastTyping = 0;
$('text').addEventListener('input', () => {
  if (Date.now() - lastTyping > 1000 && ws.readyState === 1) { ws.send(JSON.stringify({ type: 'typing' })); lastTyping = Date.now(); }
});

async function uploadFile(file) {
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  $('typing').textContent = 'Mengunggah ' + file.name + '...';
  try {
    const res = await fetch('/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload gagal');
    ws.send(JSON.stringify({ type: 'file', file: data }));
    $('typing').textContent = '';
  } catch (err) {
    $('typing').textContent = 'Gagal mengunggah: ' + err.message;
  }
}
$('attach').onclick = () => $('fileInput').click();
$('fileInput').onchange = (e) => { uploadFile(e.target.files[0]); e.target.value = ''; };

// Drag & drop and paste screenshots
window.addEventListener('dragover', (e) => { e.preventDefault(); $('drop').style.display = 'flex'; });
window.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) $('drop').style.display = 'none'; });
window.addEventListener('drop', (e) => { e.preventDefault(); $('drop').style.display = 'none'; uploadFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', (e) => {
  const f = [...(e.clipboardData?.files || [])][0];
  if (f) uploadFile(f);
});
</script>
