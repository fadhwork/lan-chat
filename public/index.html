<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Chat</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --text:#1d1f23; --muted:#7a8088; --accent:#2f6fed; --mine:#dce8ff; --border:#e2e5ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --panel:#1f2227; --text:#e8eaed; --muted:#8b929b; --accent:#5b8cff; --mine:#27406e; --border:#2c3037; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--text); display: flex; }
  #side { width: 200px; background: var(--panel); border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
  #side h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  #side div { padding: 4px 0; font-size: 14px; }
  #side div::before { content: "● "; color: #3bb55e; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; word-wrap: break-word; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: var(--mine); }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg img { max-width: 100%; max-height: 260px; border-radius: 6px; display: block; margin-top: 4px; }
  .msg a { color: var(--accent); }
  #typing { height: 20px; padding: 0 16px; font-size: 12px; color: var(--muted); }
  #bar { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-top: 1px solid var(--border); }
  #text { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 0 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); font-size: 18px; }
  #drop { display: none; position: fixed; inset: 0; background: rgba(47,111,237,.15); border: 3px dashed var(--accent); align-items: center; justify-content: center; font-size: 22px; z-index: 9; }
  @media (max-width: 600px) { #side { display: none; } }
</style>
</head>
<body>
<div id="side"><h3>Online</h3><div id="users"></div></div>
<div id="main">
  <div id="messages"></div>
  <div id="typing"></div>
  <div id="bar">
    <button class="ghost" id="attach" title="Send file">📎</button>
    <input type="file" id="fileInput" hidden>
    <input id="text" placeholder="Type a message..." autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>
<div id="drop">Drop file to send</div>

<script>
let name = localStorage.getItem('chatName');
while (!name || !name.trim()) name = prompt('Your name:') || '';
name = name.trim().slice(0, 30);
localStorage.setItem('chatName', name);

const $ = (id) => document.getElementById(id);
const messages = $('messages');
let ws;

function fmtSize(b) { return b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(b/1024))+' KB'; }
function fmtTime(t) { return new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

function addMessage(m) {
  const div = document.createElement('div');
  div.className = 'msg' + (m.user === name ? ' mine' : '');
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = m.user + ' · ' + fmtTime(m.time);
  div.appendChild(meta);

  if (m.type === 'chat') {
    div.appendChild(document.createTextNode(m.text)); // textContent-safe: no HTML injection
  } else if (m.type === 'file') {
    const a = document.createElement('a');
    a.href = m.file.url; a.target = '_blank'; a.download = m.file.name;
    a.textContent = '📄 ' + m.file.name + ' (' + fmtSize(m.file.size) + ')';
    div.appendChild(a);
    if (m.file.isImage) {
      const img = document.createElement('img');
      img.src = m.file.url;
      div.appendChild(img);
    }
  }
  const atBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
  messages.appendChild(div);
  if (atBottom || m.user === name) messages.scrollTop = messages.scrollHeight;
}

let typingTimer;
function connect() {
  ws = new WebSocket('ws://' + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', name }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'history') { messages.innerHTML = ''; m.messages.forEach(addMessage); messages.scrollTop = messages.scrollHeight; }
    else if (m.type === 'chat' || m.type === 'file') {
      addMessage(m);
      if (m.user !== name && document.hidden) { document.title = '● New message'; }
    }
    else if (m.type === 'users') {
      $('users').innerHTML = '';
      m.users.forEach((u) => { const d = document.createElement('div'); d.textContent = u; $('users').appendChild(d); });
    }
    else if (m.type === 'typing') {
      $('typing').textContent = m.user + ' is typing...';
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => $('typing').textContent = '', 1500);
    }
  };
  ws.onclose = () => setTimeout(connect, 2000); // auto-reconnect
}
connect();
document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = 'Office Chat'; });

function sendText() {
  const t = $('text').value;
  if (!t.trim() || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'chat', text: t }));
  $('text').value = '';
}
$('send').onclick = sendText;
$('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });
let lastTyping = 0;
$('text').addEventListener('input', () => {
  if (Date.now() - lastTyping > 1000 && ws.readyState === 1) { ws.send(JSON.stringify({ type: 'typing' })); lastTyping = Date.now(); }
});

async function uploadFile(file) {
  if (!file) return;
  const fd = new FormData();
  fd.append('file', file);
  $('typing').textContent = 'Uploading ' + file.name + '...';
  try {
    const res = await fetch('/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    ws.send(JSON.stringify({ type: 'file', file: data }));
    $('typing').textContent = '';
  } catch (err) {
    $('typing').textContent = 'Upload failed: ' + err.message;
  }
}
$('attach').onclick = () => $('fileInput').click();
$('fileInput').onchange = (e) => { uploadFile(e.target.files[0]); e.target.value = ''; };

// Drag & drop and paste screenshots
window.addEventListener('dragover', (e) => { e.preventDefault(); $('drop').style.display = 'flex'; });
window.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) $('drop').style.display = 'none'; });
window.addEventListener('drop', (e) => { e.preventDefault(); $('drop').style.display = 'none'; uploadFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', (e) => {
  const f = [...(e.clipboardData?.files || [])][0];
  if (f) uploadFile(f);
});
</script>
</body>
</html>
