name: Build LAN Chat Portable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx @yao-pkg/pkg . --targets node20-win-x64 --output lan-chat.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lan-chat
          path: lan-chat.exe
